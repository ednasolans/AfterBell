sonar.projectKey=ednasolans_AfterBell
sonar.organization=ednasolans
sonar.projectName=AfterBell
sonar.sourceEncoding=UTF-8

# Code to analyse: the app, the Edge Functions and the scripts
sonar.sources=mobile/src
# add supabase/functions when db is created
sonar.exclusions=**/node_modules/**,**/*.test.ts,**/*.test.tsx,**/__tests__/**,mobile/src/test-utils/**,mobile/src/lib/database.types.ts

# Tests: next to the code (*.test.ts / *.test.tsx), in __tests__ folders, and test helpers
sonar.tests=mobile/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**,mobile/src/test-utils/**

# Coverage report generated by Jest
sonar.javascript.lcov.reportPaths=mobile/coverage/lcov.info
# Screens are kept thin and their logic is tested in src/features and src/lib.
# Configuration files are excluded too. Keep in sync with "collectCoverageFrom" in mobile/package.json.
sonar.coverage.exclusions=scripts/**,.github/**,mobile/src/app/**,mobile/src/lib/supabase.ts,mobile/src/lib/queryClient.ts,mobile/src/test-utils/**,**/*.test.ts,**/*.test.tsx,**/__tests__/**

# Language settings
sonar.typescript.tsconfigPaths=mobile/tsconfig.json
sonar.python.version=3.12
