name: Sprint charts

on:
  schedule:
    - cron: "0 22 * * *"   # every day at 22:00 UTC (00:00 in Spain, summer time)
  workflow_dispatch:         # run it manually from the Actions tab

env:
  MILESTONE: Sprint 1
  SPRINT_START: "2026-10-06"
  SPRINT_END: "2026-10-27"
  THEME: light                        # light or dark
  PROJECT_NUMBER: "2"                
  ESTIMATE_FIELD: Hours estimated     # exact name of the estimated-hours field
  ACTUAL_FIELD: Hours completed       # exact name of the actual-hours field

jobs:
  charts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Personal token with the read:project scope (github.token cannot read user Projects)
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # Noto Sans is the font GitHub uses on Linux
          sudo apt-get update && sudo apt-get install -y fonts-noto-core
          pip install matplotlib

      - name: Burndown chart
        run: |
          python scripts/burndown.py \
            --repo "$GITHUB_REPOSITORY" \
            --milestone "$MILESTONE" \
            --start "$SPRINT_START" \
            --end "$SPRINT_END" \
            --theme "$THEME" \
            --project-number "$PROJECT_NUMBER" \
            --estimate-field "$ESTIMATE_FIELD" \
            --actual-field "$ACTUAL_FIELD" \
            --output burndown.png

      - name: Gantt chart
        run: |
          python scripts/gantt.py \
            --repo "$GITHUB_REPOSITORY" \
            --milestone "$MILESTONE" \
            --start "$SPRINT_START" \
            --end "$SPRINT_END" \
            --theme "$THEME" \
            --project-number "$PROJECT_NUMBER" \
            --output gantt.png

      - name: Upload charts
        uses: actions/upload-artifact@v4
        with:
          name: sprint-charts
          path: |
            burndown.png
            gantt.png